<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahtabs Wunschliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, leise, kindlich – eine Hilfe, kein Bestellformular
   IDEA: ein Bogen Glitzer-Sticker; vergebene Sticker sind "abgezogen"
   PICTURE: gezeichnetes Einhorn auf rosa Feld, darunter die Liste selbst
   COLOUR and TYPE: Rosa-Feld, tiefes Pflaumen-Ink, Gold als Akzent; Fredoka + Nunito
   LAYOUT: eine ruhige Spalte, Gruppen als Kartenreihen, mobil zuerst */
:root{color-scheme:light dark;
--bg:light-dark(#fff7fa,#1d1420);--field:light-dark(#ffd9e8,#3a2140);--card:light-dark(#ffffff,#2a1c2f);
--ink:light-dark(#3b1838,#fbe9f2);--soft:light-dark(#7d5577,#cfa9c6);--gold:light-dark(#c98a12,#f3c25a);
--line:light-dark(#f2cadb,#4a2f4f);--ok:light-dark(#2f7a5b,#8fe0b9)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1160px;margin:0 auto}
#list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:860px){#list{grid-template-columns:1fr}}
#list section{margin-top:0;scroll-margin-top:16px}
.toc{display:none;margin-top:16px;gap:8px;flex-direction:column}.toc a{display:flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:14px;background:var(--card);color:var(--ink);font-weight:700;text-decoration:none;border:1.5px solid var(--line)}.toc a::after{content:'↓';margin-left:auto;padding-left:10px}
@media(max-width:860px){.toc{display:flex}}
header{background:var(--field)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 190px;max-width:900px;gap:24px;align-items:center}
h1{font:600 clamp(34px,6vw,50px)/1.05 Fredoka,system-ui,sans-serif;margin:0 0 12px;text-wrap:balance}
h2{font:600 24px/1.2 Fredoka,system-ui,sans-serif;margin:0 0 4px}
.lead{margin:0;max-width:60ch}
.how{margin:14px 0 0;font-size:15px;color:var(--soft)}
svg.uni{width:100%;height:auto;display:block}
section{margin-top:34px}section:first-child{margin-top:0}
.hint{margin:0 0 12px;color:var(--soft);font-size:15px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.name{flex:1 1 200px;font-weight:600}
.tags{display:block}.tag,.who{display:inline-block;font-size:13px;font-weight:700;color:var(--gold);margin-right:10px;white-space:nowrap}.who{color:var(--soft)}
button[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
button{font:700 15px Nunito,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.main{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
li.taken{border-style:dashed}li.taken .txt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.tally{display:inline-flex;gap:4px;vertical-align:middle}.tally svg{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.note{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:var(--field);color:var(--ink);font-weight:600}
button:disabled{opacity:.5}
.status{font-size:14px;font-weight:700;color:var(--soft);white-space:nowrap}
li.mine{border-color:var(--ok)}li.mine .status{color:var(--ok)}
.panel{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line);display:grid;gap:10px}
.panel label{font-size:14px;color:var(--soft)}
input{font:16px Nunito,system-ui,sans-serif;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;text-decoration:none}
.msg{font-size:14px;color:var(--soft);margin:0}
footer{color:var(--soft);font-size:15px;text-align:center}
@media(max-width:600px){.top{grid-template-columns:1fr}.top svg{max-width:170px;margin:0 auto;order:-1}}
@media(prefers-reduced-motion:no-preference){.spark{animation:tw 2.4s ease-in-out infinite}.spark:nth-of-type(2){animation-delay:.8s}.spark:nth-of-type(3){animation-delay:1.6s}@keyframes tw{50%{opacity:.25}}}
</style>
</head>
<body>
<header class="band"><div class="wrap top">
  <div>
    <h1>Mahtab wird fünf</h1>
    <p class="lead">Weil so viele gefragt haben: hier ein paar Ideen, worüber sie sich freuen würde. Ganz ohne Muss.</p>
    <nav class="toc" aria-label="Inhalt"><a href="#wunschliste">Mahtabs Wunschliste</a><a href="#eltern">Wünsche, die wir Eltern besonders unterstützen</a></nav>
  </div>
  <svg class="uni" viewBox="0 0 200 200" role="img" aria-label="Gezeichnetes Einhorn">
    <circle cx="100" cy="104" r="88" fill="#fff" opacity=".55"/>
    <path d="M118 30 L104 78 L126 82 Z" fill="#f3c25a" stroke="#c98a12" stroke-width="2" stroke-linejoin="round"/>
    <path d="M110 56l12 3M107 67l15 3" stroke="#c98a12" stroke-width="2"/>
    <path d="M70 92c0-22 20-32 42-28 26 5 40 30 38 56-2 22-10 40-20 52H70c-8-18-10-36 0-48z" fill="#fff" stroke="#3b1838" stroke-width="3"/>
    <ellipse cx="128" cy="140" rx="22" ry="17" fill="#ffd9e8" stroke="#3b1838" stroke-width="3"/>
    <circle cx="122" cy="138" r="2.6" fill="#3b1838"/><circle cx="134" cy="138" r="2.6" fill="#3b1838"/>
    <path d="M104 106q8 7 16 0" fill="none" stroke="#3b1838" stroke-width="3" stroke-linecap="round"/>
    <circle cx="98" cy="122" r="7" fill="#ffb3cf"/>
    <path d="M86 78l-8-16 18 8" fill="#fff" stroke="#3b1838" stroke-width="3" stroke-linejoin="round"/>
    <path d="M72 74c-26 6-34 34-24 60 8 22 6 34 0 40 22-2 30-20 26-40" fill="#c9a7ff" stroke="#3b1838" stroke-width="3"/>
    <path d="M80 72c-14 14-16 36-6 56" fill="none" stroke="#ff8fbf" stroke-width="8" stroke-linecap="round"/>
    <path d="M88 70c-6 12-6 26 0 38" fill="none" stroke="#8fd6ff" stroke-width="7" stroke-linecap="round"/>
    <g fill="#f3c25a"><path class="spark" d="M160 46l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path class="spark" d="M36 50l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path class="spark" d="M168 150l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/></g>
  </svg>
</div></header>

<main class="band"><div class="wrap">
  <p id="err" class="msg" hidden>Der aktuelle Stand konnte gerade nicht geladen werden. Bitte Seite später neu laden.</p>
  <p id="note" class="msg note" role="status" hidden></p>
  <div id="list"></div>
</div></main>


<script>
{
// m = gern auch mehrere
const GRUPPEN = [
  {id:"wunschliste", t:"Mahtabs Wunschliste", items:[
    ["leuchteinhorn","Leuchtendes Einhorn"],
    ["shirt","Buntes Einhorn-T-Shirt oder Poloshirt mit Glitzer"],
    ["haarreif","Einhorn-Haarreif"],
    ["nagellack","Einhorn-Nagellack-Set für Kinder"],
    ["kette","Einhorn-Halskette"],
    ["armband","Einhorn-Armband"],
    ["schmuck","Weiterer Einhorn-Schmuck","m"],
    ["sticker","Einhorn- oder Glitzer-Sticker","m"],
    ["spangen","Haarspangen oder Haargummis mit Glitzer","m"],
    ["rock","Rock mit Blumen-, Schmetterlings-, Feen-, Meerjungfrauen- oder Kirschmotiv","m"],
    ["glitzer","Kleidung mit Sternen, Glitzer oder goldenen Pailletten","m"],
    ["muetze","Wintermütze"],
    ["handschuhe","Wasserdichte Winterhandschuhe, am liebsten mit Einhornmotiv"],
    ["schatzkiste","Schatzkiste oder Schmuckkästchen für ihre kleinen Schätze"],
    ["brille","Brille (keine Sonnenbrille)"],
    ["etui","Brillenetui oder Brillenbox mit Einhorn- oder Meerjungfrauenmotiv"],
    ["tonie","Tonie-Figur","m"]]},
  {id:"eltern", t:"Wünsche, die wir Eltern besonders unterstützen", items:[
    ["pinsel","Pinsel für Wasserfarben","m"],
    ["clay","Lufttrocknende Modelliermasse (Air-Dry Clay)","m"],
    ["papier","Glitzer- oder Tonpapier zum Basteln","m"],
    ["sperrholz","Sperrholzplatte für die Laubsäge","m"],
    ["stoffstifte","Filzstifte für Stoff","m"],
    ["springseil","Springseil"],
    ["haarbuerste","Haarbürste","m"],
    ["buch-lesen","Bücher zum Selberlesen","m"],
    ["buch-vorlesen","Bücher zum Vorlesen","m"]]}
];

// Speicher: 3 Zähler bei abacus.jasoncameron.dev, je Wunsch 5 Bit (0–31).
// Reihenfolge NIE ändern – neue Wünsche nur hinten anhängen (max. 27).
const SLOTS = ["leuchteinhorn","shirt","haarreif","nagellack","kette","armband","schmuck","sticker","spangen",
  "rock","glitzer","muetze","handschuhe","schatzkiste","brille","etui","tonie","pinsel",
  "clay","papier","sperrholz","stoffstifte","springseil","haarbuerste","buch-lesen","buch-vorlesen"];
const API = 'https://abacus.jasoncameron.dev', NS = 'mahtab5-x7q2k9';
const KEYS = [['cnt0','ffcb5fb1-9684-45ed-9598-fa4af82f7ce9'],['cnt1','0b1f5acb-52a7-4fbf-8b59-f321c29db821'],['cnt2','c9f944ab-151b-4e89-92fc-fc9a1fbb6943']];
const vals = [0, 0, 0];
const slot = id => { const i = SLOTS.indexOf(id); return [Math.floor(i / 9), 32 ** (i % 9)]; };
const count = id => { const [c, u] = slot(id); return Math.floor(vals[c] / u) % 32; };
async function load() {
  try {
    const r = await Promise.all(KEYS.map(([k]) => fetch(`${API}/get/${NS}/${k}`).then(x => { if (!x.ok) throw 0; return x.json(); })));
    r.forEach((j, i) => vals[i] = j.value);
    document.getElementById('err').hidden = true;
  } catch (e) { document.getElementById('err').hidden = false; throw e; }
}
async function change(id, dir) {
  const [c, u] = slot(id);
  const r = await fetch(`${API}/update/${NS}/${KEYS[c][0]}?value=${dir * u}`, {method: 'POST', headers: {Authorization: 'Bearer ' + KEYS[c][1]}});
  if (!r.ok) throw 0;
  vals[c] = (await r.json()).value;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mine = {};
try { mine = JSON.parse(localStorage.getItem('mahtab-mine2') || '{}'); } catch(e) {}
const save = () => { try { localStorage.setItem('mahtab-mine2', JSON.stringify(mine)); } catch(e) {} };
const isMulti = {}; GRUPPEN.forEach(g => g.items.forEach(([id, , f = '']) => isMulti[id] = f.includes('m')));
let busy = false;

function tally(n) {
  let h = '';
  for (let g = 0; g < n; g += 5) {
    const k = Math.min(5, n - g), w = 30;
    let l = '';
    for (let i = 0; i < Math.min(k, 4); i++) l += `<line x1="${4 + i * 7}" y1="3" x2="${4 + i * 7}" y2="21"/>`;
    if (k === 5) l += '<line x1="1" y1="18" x2="28" y2="6"/>';
    h += `<svg viewBox="0 0 ${w} 24" width="${w}" height="24">${l}</svg>`;
  }
  return `<span class="tally" role="img" aria-label="${n} mal gewählt">${h}</span>`;
}

function itemHTML([id, name]) {
  const multi = isMulti[id], n = count(id), isMine = !!mine[id];
  const taken = !multi && n > 0;
  const cls = taken ? (isMine ? 'taken mine' : 'taken') : isMine ? 'mine' : '';
  let right;
  if (isMine) right = `<span class="status">von dir gewählt</span><button data-undo="${id}">Zurück</button>`;
  else if (taken) right = `<span class="status">schon vergeben</span>`;
  else if (n >= 30) right = `<span class="status">genug davon</span>`;
  else right = `<button class="main" data-pick="${id}">Das schenke ich</button>`;
  const tags = multi ? `<span class="tags"><span class="tag">gern auch mehrere</span>${n ? tally(n) : ''}</span>` : '';
  return `<li class="${cls}"><div class="row"><span class="name"><span class="txt">${esc(name)}</span>${tags}</span>${right}</div></li>`;
}

const root = document.getElementById('list'), note = document.getElementById('note');
function render() {
  root.innerHTML = GRUPPEN.map(g => `<section id="${g.id}"><h2>${esc(g.t)}</h2><ul>${g.items.map(itemHTML).join('')}</ul></section>`).join('');
}
const say = t => { note.textContent = t; note.hidden = !t; };

root.addEventListener('click', async e => {
  const b = e.target.closest('[data-pick],[data-undo]');
  if (!b || busy) return;
  busy = true; b.disabled = true; say('');
  try {
    if (b.dataset.pick) {
      const id = b.dataset.pick;
      await load();
      if (!isMulti[id] && count(id) > 0) say('Das hat gerade jemand anderes gewählt. Such dir gern etwas anderes aus.');
      else { await change(id, 1); mine[id] = 1; save(); }
    } else {
      const id = b.dataset.undo;
      await load();
      if (count(id) > 0) await change(id, -1);
      delete mine[id]; save();
    }
  } catch (err) { say('Das hat gerade nicht geklappt. Bitte gleich nochmal versuchen.'); }
  busy = false; render();
});
render();
load().then(render, () => {});
setInterval(() => { if (!busy) load().then(render, () => {}); }, 60000);
}
</script>
</body>
</html>
